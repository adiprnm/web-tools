---
layout: tool
tool: time-calculator
title: Time Calculator
description: Jumlahkan jam, menit, dan detik dari beberapa baris sekaligus.
---
<div class="time-rows" id="time-rows"></div>

<div class="actions">
  <button class="btn btn--quiet" type="button" id="time-add">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
    Tambah waktu
  </button>
</div>

<div class="total">
  <p class="total-label">Total waktu</p>
  <p class="total-value" id="time-total" aria-live="polite">00:00:00</p>
  <p class="total-note" id="time-note"></p>
</div>

<script>
  (function () {
    var rowsContainer = document.getElementById("time-rows");
    var addButton = document.getElementById("time-add");
    var totalEl = document.getElementById("time-total");
    var noteEl = document.getElementById("time-note");
    var counter = 0;

    function createRow() {
      counter += 1;
      var row = document.createElement("div");
      row.className = "time-row";
      row.innerHTML =
        '<div class="time-cell">' +
          '<label for="time-h-' + counter + '">Jam</label>' +
          '<input id="time-h-' + counter + '" type="number" min="0" inputmode="numeric" placeholder="0" data-unit="hours">' +
        '</div>' +
        '<div class="time-cell">' +
          '<label for="time-m-' + counter + '">Menit</label>' +
          '<input id="time-m-' + counter + '" type="number" min="0" inputmode="numeric" placeholder="0" data-unit="minutes">' +
        '</div>' +
        '<div class="time-cell">' +
          '<label for="time-s-' + counter + '">Detik</label>' +
          '<input id="time-s-' + counter + '" type="number" min="0" inputmode="numeric" placeholder="0" data-unit="seconds">' +
        '</div>' +
        '<button class="icon-btn icon-btn--danger time-remove" type="button" aria-label="Hapus baris waktu">' +
          '<svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>' +
        '</button>';

      rowsContainer.appendChild(row);
      updateRemoveButtons();
      return row;
    }

    function updateRemoveButtons() {
      var rows = rowsContainer.querySelectorAll(".time-row");
      rows.forEach(function (row) {
        var button = row.querySelector(".time-remove");
        button.disabled = rows.length === 1;
      });
    }

    function readValue(input) {
      var value = parseInt(input.value, 10);
      return isNaN(value) ? 0 : Math.max(0, value);
    }

    function calculate() {
      var totalSeconds = 0;

      rowsContainer.querySelectorAll(".time-row").forEach(function (row) {
        totalSeconds += readValue(row.querySelector('[data-unit="hours"]')) * 3600;
        totalSeconds += readValue(row.querySelector('[data-unit="minutes"]')) * 60;
        totalSeconds += readValue(row.querySelector('[data-unit="seconds"]'));
      });

      var seconds = totalSeconds % 60;
      var minutes = Math.floor(totalSeconds / 60) % 60;
      var hours = Math.floor(totalSeconds / 3600);

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      totalEl.textContent = pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);

      if (totalSeconds >= 86400) {
        var days = Math.floor(totalSeconds / 86400);
        noteEl.textContent = "Setara " + days + " hari " + (hours % 24) + " jam " + minutes + " menit.";
      } else {
        noteEl.textContent = "";
      }
    }

    addButton.addEventListener("click", function () {
      var row = createRow();
      var firstInput = row.querySelector("input");
      calculate();
      firstInput.focus();
    });

    rowsContainer.addEventListener("input", calculate);

    rowsContainer.addEventListener("click", function (event) {
      var button = event.target.closest(".time-remove");
      if (!button || button.disabled) return;

      var row = button.closest(".time-row");
      if (row) {
        row.remove();
        updateRemoveButtons();
        calculate();
      }
    });

    createRow();
    calculate();
  })();
</script>
