---
layout: tool
tool: text-obfuscator
title: Text Obfuscator
description: Samarkan teks mulai dari paragraf tertentu. Berguna untuk cuplikan atau pratinjau.
---
<div class="field">
  <div class="field-top">
    <label class="field-label" for="obf-text">Teks asli</label>
    <span class="field-hint">satu paragraf per baris</span>
  </div>
  <textarea id="obf-text" rows="10" placeholder="Tempel teks di sini..."></textarea>
  <p class="field-error" id="obf-text-error" role="alert"></p>
</div>

<div class="field-row">
  <div class="field">
    <div class="field-top">
      <label class="field-label" for="obf-start">Mulai samarkan dari paragraf</label>
    </div>
    <input id="obf-start" type="number" min="1" value="4" inputmode="numeric">
    <p class="field-error" id="obf-start-error" role="alert"></p>
  </div>
</div>

<div class="actions">
  <button class="btn btn--primary" type="button" id="obf-run">
    <svg class="icon" aria-hidden="true"><use href="#i-text"></use></svg>
    Samarkan teks
  </button>
  <button class="btn btn--quiet" type="button" id="obf-clear">Bersihkan</button>
</div>

<section class="readout" id="obf-result" aria-live="polite" hidden>
  <div class="readout-head">
    <span class="readout-label">Hasil</span>
    <button class="btn btn--small" type="button" data-copy="#obf-result-text">
      <svg class="icon" aria-hidden="true"><use href="#i-copy"></use></svg>
      <span class="btn-label">Salin</span>
    </button>
  </div>
  <div class="readout-body" id="obf-result-text"></div>
</section>

<script>
  (function () {
    var textInput = document.getElementById("obf-text");
    var startInput = document.getElementById("obf-start");
    var textError = document.getElementById("obf-text-error");
    var startError = document.getElementById("obf-start-error");
    var result = document.getElementById("obf-result");
    var resultText = document.getElementById("obf-result-text");
    var runButton = document.getElementById("obf-run");
    var clearButton = document.getElementById("obf-clear");

    function randomInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        return window.crypto.getRandomValues(new Uint32Array(1))[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function obfuscateWord(word) {
      var output = "";
      for (var i = 0; i < word.length; i++) {
        var code = word.charCodeAt(i);
        if (code >= 65 && code <= 90) {
          output += String.fromCharCode(65 + ((code - 65 + randomInt(26)) % 26));
        } else if (code >= 97 && code <= 122) {
          output += String.fromCharCode(97 + ((code - 97 + randomInt(26)) % 26));
        } else {
          output += word[i];
        }
      }
      return output;
    }

    function obfuscateParagraph(paragraph) {
      return paragraph
        .split(/(\s+)/)
        .map(function (part) {
          return /^\s+$/.test(part) ? part : obfuscateWord(part);
        })
        .join("");
    }

    function paragraphsFrom(value) {
      return value
        .split("\n")
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line.length > 0; });
    }

    function run() {
      textError.textContent = "";
      startError.textContent = "";

      var paragraphs = paragraphsFrom(textInput.value);
      if (!paragraphs.length) {
        textError.textContent = "Masukkan teks yang ingin disamarkan.";
        textInput.focus();
        return;
      }

      var start = parseInt(startInput.value, 10);
      if (isNaN(start) || start < 1) {
        startError.textContent = "Isi dengan angka 1 atau lebih.";
        startInput.focus();
        return;
      }

      if (start > paragraphs.length) {
        startError.textContent = "Teks ini hanya punya " + paragraphs.length + " paragraf.";
        startInput.focus();
        return;
      }

      resultText.textContent = "";
      paragraphs.forEach(function (paragraph, index) {
        var p = document.createElement("p");
        p.textContent = index + 1 >= start ? obfuscateParagraph(paragraph) : paragraph;
        resultText.appendChild(p);
      });

      result.hidden = false;
      result.classList.remove("is-new");
      void result.offsetWidth;
      result.classList.add("is-new");
    }

    runButton.addEventListener("click", run);

    clearButton.addEventListener("click", function () {
      textInput.value = "";
      startInput.value = "4";
      textError.textContent = "";
      startError.textContent = "";
      resultText.textContent = "";
      result.hidden = true;
      textInput.focus();
    });

    [textInput, startInput].forEach(function (field) {
      field.addEventListener("input", function () {
        textError.textContent = "";
        startError.textContent = "";
      });
    });
  })();
</script>
