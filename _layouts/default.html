<!DOCTYPE html>
<html lang="{{ site.lang | default: 'id' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#e8ebe4">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  {% if page.manifest %}<link rel="manifest" href="{{ page.manifest | relative_url }}">{% endif %}
  <link rel="preload" href="{{ '/assets/fonts/archivo-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/azeret-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if jekyll.environment == "production" and site.analytics_enabled %}
    <script defer async src="{{ site.analytics_url }}" data-website="{{ site.url | remove: 'https://' | remove: 'http://' }}" data-page="{{ page.title }}" data-website-id="{{ site.website_id }}"></script>
  {% endif %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include icon-sprite.html %}
  <a class="skip-link" href="#main">Lewati ke konten</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
